<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full screen on notched phones; safe-area padding keeps content clear. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f7f5" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Accel Business: the right internet, SIMs and business services for your shop or office, at one clear monthly price." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Accel Business</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Plus Jakarta Sans for English, Mukta for Hindi (Devanagari). display=swap shows text at once on slow networks. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
